meta:
  version: R3.1
  date: 2026-09-04
  total_rooms: 14
  total_agents: 109
  constitution_ref: AGENTS.md
  amendments:
    - "Room 08 (Data) merged into Room 04 (Architecture)"
    - "Stack Lock: Frontend=React exclusive · Backend=Laravel 11+ exclusive · Mobile=Flutter 3.22+ exclusive"
    - "Rec #16 Event-Driven: all human-time concepts removed from agent mandates"

stack_lock:
  frontend:
    framework: React 18+
    language: [HTML5, CSS3, JavaScript ES2024, TypeScript 5+]
    styling: Tailwind CSS 4+
    build: [Vite 5+, Webpack 5]
    quality: [ESLint, Prettier, Storybook 8+]
    testing: [Jest, Vitest, Playwright]
    banned: [Vue.js, Angular, Svelte, jQuery, Bootstrap]
  backend:
    framework: Laravel 11+
    exclusive: true
    language: PHP 8.3+
    orm: Eloquent
    queue: [Laravel Queues, Horizon, Redis 7+]
    database: [PostgreSQL 16+, MySQL 8+]
    testing: [PHPUnit 11+, Pest 3+, Laravel Dusk]
    tools: [Composer 2+, Artisan, Pint, Sail]
    banned: ["Symfony (standalone)", CodeIgniter, Yii, "raw PHP frameworks"]
  mobile:
    framework: Flutter 3.22+
    language: Dart 3+
    state: [Riverpod, Bloc]
    exclusive: true

