; Owais Media — Laravel backend pool (php8.5-fpm)
; Installed to /etc/php/8.5/fpm/pool.d/owais.conf by scripts/deploy-owais.sh
[owais]
user = es3dlll
group = es3dlll
listen = /run/php/owais.sock
listen.owner = es3dlll
listen.group = es3dlll
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

request_terminate_timeout = 60

php_admin_value[memory_limit] = 256M
php_admin_value[error_log] = /home/es3dlll/Desktop/Owais/backend/storage/logs/php-fpm.log
php_admin_flag[log_errors] = on

catch_workers_output = yes
