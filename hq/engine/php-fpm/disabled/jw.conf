[jw]
user = www-data
group = www-data
listen = /run/php/jw.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

request_terminate_timeout = 60

php_admin_value[memory_limit] = 128M
