# SOFI AI Agent Registry — 15 rooms, 111 agents
# Source of truth for who exists, their room, and prefix.
# Routes/budgets live in routing.yaml; persona names in personas.yaml; gates in gates.yaml.
# 2026-08-26: +3 operational-gap agents by owner order (agile-orchestrator · sandbox-executor · license-auditor) — record: hq/history/2026-08-26-operational-gaps/

rooms:
  "00-boardroom":
    code: "00"
    name_en: Boardroom
    prefix: brd
    agents: [ceo, cpo, cto, cqo, cso, chief-of-staff, arbiter]
  "01-strategy":
    code: "01"
    name_en: Product Strategy
    prefix: str
    agents: [lead, product-strategist, business-analyst, market-analyst, roadmap-planner, risk-analyst, monetization-strategist, agile-orchestrator]
  "02-research":
