# Persona registry — agent-id ↔ persona name mapping (Syrian persona names, Latin transliteration)
# Canonical source for all persona names. Serves Token Economy (Teaching IV): one name, one lookup.
#
# Dual-hat convention (intentional, not an error): four persons hold both a boardroom C-seat
# and the lead chair of the room they govern — same human, two agent-ids, two routes:
#   Luay Al-Hakim     = brd-cto  + arc-lead   (technology seat governs Architecture)
#   Lama Al-Trabulsi  = brd-cqo  + qa-lead    (quality seat governs Quality)
#   Wajih Al-Issami   = brd-cso  + sec-lead   (security seat governs Security)
#   Nazih Al-Muhaini  = brd-cpo  + str-lead   (product seat governs Strategy)
# Each agent-id keeps its own routing.yaml entry; the shared human is the same, the roles are distinct.

