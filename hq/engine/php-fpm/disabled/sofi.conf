[sofi]
user = es3dlll
group = es3dlll
listen = /run/php/sofi.sock
listen.owner = es3dlll
listen.group = es3dlll
listen.mode = 0660

; Production: static pm = more consistent latency under load
; pm.max_children = total RAM / avg PHP process (~50MB)
; 30GB / 50MB ≈ 600, cap at 100 for safety
pm = static
pm.max_children = 100
pm.max_requests = 1000

; Timeouts
request_terminate_timeout = 60
request_slowlog_timeout = 5
slowlog = /var/log/php/sakk-slow.log

php_admin_value[error_log] = /var/log/php/sakk-error.log
php_admin_flag[log_errors] = on
catch_workers_output = yes
php_admin_value[memory_limit] = 256M
